{% extends "auctions/layout.html" %}

{% block body %}
    <h2>Watched Listings</h2>

    {% if user.watchlist.all %}
        {% for listing in user.watchlist.all %}
            <div><a href="{% url 'listing' listing.id %}">{{ listing.title }} {{ listing.description }} {{ listing.starting_bid }}</a></div>
        {% endfor %} 
    {% else %}
        <div>No watched listings...</div>
    {% endif %}

{% endblock %}
